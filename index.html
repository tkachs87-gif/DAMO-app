<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>다모 (DAMO)</title>
  <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; margin: 0; padding: 16px; color: #333; }
    .header { font-size: 22px; font-weight: bold; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .alert-card { background-color: #fff5f5; border: 1px solid #feb2b2; }
    .badge { background: #e53e3e; color: white; font-size: 12px; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
    .btn-kakao { background-color: #FEE500; color: #000000; border: none; border-radius: 8px; padding: 8px 12px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-match { background-color: #3182ce; color: white; border: none; border-radius: 8px; padding: 8px 12px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .box-gray { background: #f7fafc; border-radius: 8px; padding: 12px; margin-top: 10px; border: 1px solid #edf2f7; }
  </style>
</head>
<body>

  <div class="header">
    🏢 다모 (DAMO)
    <span style="font-size: 14px; color: #718096;">Dongsak-dong / Seojeong-dong</span>
  </div>

  <!-- ⚠️ 상단 핀: 확인이 필요한 수금 건 -->
  <div class="card alert-card" id="alertBox">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="color: #c53030; font-weight: bold;">⚠️ 확인 필요한 수금 건</span>
      <span class="badge">미입금 1건</span>
    </div>
    
    <div id="unpaidRow" class="row" style="border-bottom: 1px solid #fed7d7; padding-bottom: 10px;">
      <div>
        <strong style="font-size: 15px;">402호 김두영</strong>
        <div style="font-size: 12px; color: #e53e3e;">9월 월세 50만원 미입금 (3일 연체)</div>
      </div>
      <button class="btn-kakao" onclick="shareKakao()">💬 소장님 카톡 공유</button>
    </div>

    <!-- 예외 입금 매칭 -->
    <div class="box-gray row" id="exceptionRow">
      <div>
        <strong style="font-size: 14px;">💡 [미확인 입금] 500,000원</strong>
        <div style="font-size: 12px; color: #4a5568;">입금자명: "김부모" (402호 추정)</div>
      </div>
      <button class="btn-match" onclick="approveMatch()">매칭 승인</button>
    </div>
  </div>

  <!-- 📊 수금 현황 -->
  <div class="card">
    <strong style="font-size: 16px;">📊 9월 수금 현황</strong>
    <div class="row" style="margin-top: 12px;">
      <span style="color: #4a5568;">전체 12세대 중</span>
      <strong style="color: #2b6cb0;" id="statusText">11세대 완납 / 1세대 연체</strong>
    </div>
    <div class="row" style="margin-top: 6px;">
      <span style="color: #4a5568;">이번 달 입금액</span>
      <strong style="font-size: 18px; color: #2d3748;" id="amountText">8,200,000 원 / 8,700,000 원</strong>
    </div>
  </div>

  <script>
    // 카카오 SDK 초기화 (공식 테스트키)
    Kakao.init('8d289fb350d5e1b21bbbf1217e2c9f4d'); 

    // 소장님 카톡 인앱 공유
    function shareKakao() {
      Kakao.Share.sendDefault({
        objectType: 'text',
        text: '[DAMO 수금 확인 요청]\n대박부동산 소장님, 안녕하세요!\n402호(김두영 님) 월세가 아직 미입금 상태입니다.\n확인 한 번만 부탁드립니다!\n\n• 호실: 골든캐슬 402호\n• 미납 금액: 500,000원\n• 연체 일수: 3일째',
        link: {
          mobileWebUrl: 'https://damo.kr/settle/p402',
          webUrl: 'https://damo.kr/settle/p402',
        },
      });
    }

    // 예외 입금 1-Click 매칭 승인
    function approveMatch() {
      document.getElementById('unpaidRow').style.display = 'none';
      document.getElementById('exceptionRow').innerHTML = '✅ <strong>"김부모" ➔ 402호 매칭 완료!</strong> (자동 학습 규칙 저장됨)';
      document.getElementById('statusText').innerText = '12세대 전세대 완납!';
      document.getElementById('amountText').innerText = '8,700,000 원 / 8,700,000 원';
      alert('402호 수금 처리가 완료되었습니다. 다음 입금부터 자동 승인됩니다!');
    }
  </script>
</body>
</html>
